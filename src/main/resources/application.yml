spring:
  application:
    name: jwt-auth-api
  profiles:
    default: dev
  jpa:
    open-in-view: false

server:
  error:
    include-stacktrace: never

app:
  jwt:
    # Required. No default outside the dev profile.
    secret: ${JWT_SECRET:}
    issuer: jwt-auth-api
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
