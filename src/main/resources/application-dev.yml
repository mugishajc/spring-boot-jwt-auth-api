spring:
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update

app:
  jwt:
    # Local development only. Any real deployment must set JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-production-0123456789}
  bootstrap-admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:Admin123!dev}
