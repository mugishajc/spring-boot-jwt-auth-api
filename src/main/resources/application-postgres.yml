# Activate with SPRING_PROFILES_ACTIVE=postgres. All values come from the environment.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${DB_USERNAME:auth}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # Fine for a demo. A real deployment would manage schema with Flyway or Liquibase.
      ddl-auto: update
